name: spatial-brain
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  # scientific python (numpy pinned <2 for the scvi-tools / cell2location ABI)
  - numpy<2
  - scipy>=1.9
  - pandas>=1.5
  - scikit-learn>=1.1
  - matplotlib>=3.6
  - seaborn>=0.12
  - pyyaml>=6.0
  - tqdm>=4.64
  # single-cell / spatial
  - scanpy>=1.9,<1.11
  - anndata>=0.9,<0.11
  - squidpy>=1.2,<1.5
  - leidenalg>=0.9
  - python-igraph>=0.10
  - jupyter>=1.0
  # pip-only pieces (deconvolution + SVG)
  - pip>=22
  - pip:
      - SpatialDE>=1.1.3
      - scvi-tools>=0.20,<1.1
      - cell2location>=0.1.3
